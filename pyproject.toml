[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "solaire-education"
version = "1.6.7"
description = "OriginReach teaching and assessment platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "fastapi>=0.110",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openai>=1.30",
    "anthropic>=0.97,<0.98",
    "tiktoken>=0.7",
    "tokenizers>=0.20.0,<1",
    "pdfplumber>=0.10",
    "reportlab>=4.2",
    "Pillow>=10.0",
    "pillow-heif>=0.18",
    "rdkit>=2024.3.1",
    "trafilatura>=1.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
primebrush-plot = ["matplotlib>=3.8"]
primebrush-pdf = ["cairosvg>=2.7"]
ocr = ["pytesseract>=0.3"]
dev = ["pytest>=7", "httpx2>=2.9.1"]
release = ["pyinstaller>=6.0"]

[project.scripts]
solaire-exam = "solaire.exam_compiler.cli:main"
solaire-web = "solaire.web.__main__:main"
solaire-desktop = "solaire.desktop_entry:main"
primebrush = "solaire.primebrush.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/solaire/agent_layer/tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
"solaire.exam_compiler" = ["templates/latex/*.j2", "templates/latex/*.metadata_ui.yaml"]
"solaire.agent_layer" = ["skills/**/*"]
"solaire.web" = [
  "bundled_project_templates/**/*",
  "bundled_project_templates/math/.solaire/**/*",
  "bundled_common_templates/**/*",
  "assets/help_docs/**/*",
  "assets/tools/**/*",
]
