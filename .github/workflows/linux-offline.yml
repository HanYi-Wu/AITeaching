name: Linux offline installer
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Upload the verified bundle to an existing version tag'
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Protect existing release tag
        if: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          TARGET_TAG="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            TARGET_TAG="v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | tr -d '[:space:]')"
          fi
          git fetch --depth=1 origin "refs/tags/$TARGET_TAG:refs/tags/$TARGET_TAG"
          TAG_COMMIT="$(git rev-parse "$TARGET_TAG^{commit}")"
          if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Refusing to replace $TARGET_TAG assets with code from a different commit. Create the matching version tag or build with publish_release=false."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: eh-runtime
          create-args: >-
            python=3.12 pip cairo tesseract conda-pack
          cache-environment: true
      - name: Prepare runtime (network allowed only on builder)
        shell: micromamba-shell {0}
        run: |
          python -m pip install ".[primebrush-pdf,ocr]" pytest httpx2
          mkdir -p "$CONDA_PREFIX/share/tessdata"
          curl -fL --retry 3 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/chi_sim.traineddata -o "$CONDA_PREFIX/share/tessdata/chi_sim.traineddata"
          curl -fL --retry 3 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata -o "$CONDA_PREFIX/share/tessdata/eng.traineddata"
          python -m pytest -q -ra
      - name: Build frontend
        working-directory: web
        run: npm ci && npm test -- --reporter=dot && npm run build
      - name: PrimeBrush Rust tests
        working-directory: primebrush-rs
        run: cargo test --workspace
      - name: Package and test real installation
        shell: micromamba-shell {0}
        run: |
          python scripts/build_linux_offline.py --runtime-prefix "$CONDA_PREFIX"
          python -m tools.release_verify offline dist-offline/*.tar.gz --ref "$GITHUB_SHA"
          bash scripts/test-offline-install-linux.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.publish_release }}
        continue-on-error: true
        with:
          name: EducationHelper-linux-x86_64-offline
          path: dist-offline/*
          compression-level: 0
          retention-days: 1
      - name: Verify release files
        run: cd dist-offline && sha256sum --check *.sha256
      - name: Publish tagged GitHub release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_TAG="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            TARGET_TAG="v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | tr -d '[:space:]')"
          fi
          gh release upload "$TARGET_TAG" dist-offline/* --repo "$GITHUB_REPOSITORY" --clobber || \
          gh release create "$TARGET_TAG" dist-offline/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "EducationHelper $TARGET_TAG" \
            --notes-file "docs/release-${TARGET_TAG#v}.md" \
            --verify-tag
