id: test_set_001
type: single_choice
content: 已知集合$A=\{x\mid\log_2(x+1)<2\}$，$B=\{-1,0,1,2,3\}$，则$A\cap B=$
options:
  A: $\{0,1,2\}$
  B: $\{-1,0,1\}$
  C: $\{0,1,2,3\}$
  D: $\{1,2\}$
answer: A
analysis: 由$\log_2(x+1)<2$，定义域$x+1>0$即$x>-1$，且$x+1<2^2=4$即$x<3$，故$A=(-1,3)$。与$B=\{-1,0,1,2,3\}$取交集：$-1$不在$A$内（开区间），$0,1,2$在$A$内，$3$不在$A$内。所以$A\cap
  B=\{0,1,2\}$。
